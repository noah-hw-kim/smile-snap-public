<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - SmileSnap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .photo-thumbnail { width: 60px; height: 60px; object-fit: cover; }
        .entry-image-clickable { cursor: pointer; max-height: 200px; object-fit: cover; }
        .photo-item:hover { background-color: #f8f9fa; cursor: pointer; }
        .content-edit { display: none; }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">📱 User Dashboard</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3" id="userInfo">Loading...</span>
                <button class="btn btn-outline-light btn-sm me-2" id="backBtn" style="display: none;">
                    <i class="bi bi-arrow-left"></i> Back to Admin
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Alert Container -->
    <div class="container mt-3">
        <div id="alertContainer"></div>
    </div>

    <!-- User Dashboard Content -->
    <div class="container mt-4" id="userSection">
        <!-- Photo Upload Card -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5>📸 Upload Screenshot</h5>
            </div>
            <div class="card-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="imageFile" class="form-label">Select Image (Max 10MB)</label>
                        <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-cloud-upload"></i> Upload
                    </button>
                </form>
            </div>
        </div>

        <div class="row">
            <!-- Photos Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>📷 My Photos</h5>
                        <button class="btn btn-sm btn-outline-primary" id="refreshPhotos">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="list-group" id="photosList">
                            <p class="text-muted">Loading photos...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Diary Entries Section -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>📖 Diary Entries</h5>
                        <div class="d-flex align-items-center gap-2">
                            <small class="text-muted" id="entryCount">0 entries</small>
                            <button class="btn btn-sm btn-outline-primary" id="refreshEntries">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="entriesList">
                            <p class="text-muted">Loading entries...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Account Management -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h6 class="mb-0">⚠️ Danger Zone</h6>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-3">Once you delete your account, there is no going back. Please be certain.</p>
                        <button class="btn btn-danger" id="deleteAccountBtn">
                            <i class="bi bi-trash"></i> Delete My Account
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
